<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糖尿病风险预测 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .risk-form { max-width: 700px; margin: 0 auto; }
    .risk-result { display: none; }
    .gauge-container { position: relative; width: 200px; height: 200px; margin: 0 auto; }
    .gauge-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#10b981 0deg 72deg, #f59e0b 72deg 180deg, #ef4444 180deg 360deg); }
    .gauge-inner { position: absolute; top: 20px; left: 20px; width: 160px; height: 160px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .step-dot { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #64748b; }
    .step-dot.active { background: var(--primary); color: white; }
    .step-dot.done { background: var(--secondary); color: white; }
    .step-line { width: 40px; height: 3px; background: #e2e8f0; align-self: center; }
    .step-line.done { background: var(--secondary); }
  </style>
</head>
<body>
  <nav class="navbar"></nav>

  <div class="container">
    <div class="card">
      <div class="card-title" style="justify-content:center;font-size:22px">
        <span class="icon">📊</span> 糖尿病风险智能评估
      </div>
      <p style="text-align:center;color:var(--text-light);margin-bottom:24px">基于AI大模型，综合分析您的健康数据，精准预测糖尿病风险</p>

      <!-- 步骤指示器 -->
      <div class="step-indicator">
        <div class="step-dot active" id="step1">1</div>
        <div class="step-line" id="line1"></div>
        <div class="step-dot" id="step2">2</div>
        <div class="step-line" id="line2"></div>
        <div class="step-dot" id="step3">3</div>
      </div>

      <!-- 表单区域 -->
      <div id="formArea" class="risk-form">
        <!-- 第一步：基本信息 -->
        <div id="page1">
          <h3 style="margin-bottom:20px;text-align:center">基本信息</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">年龄 *</label>
              <input type="number" class="form-input" id="age" placeholder="请输入年龄" min="1" max="120">
            </div>
            <div class="form-group">
              <label class="form-label">性别 *</label>
              <select class="form-select" id="gender">
                <option value="">请选择</option>
                <option value="male">男</option>
                <option value="female">女</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">身高 (cm) *</label>
              <input type="number" class="form-input" id="height" placeholder="例如：170" min="50" max="250">
            </div>
            <div class="form-group">
              <label class="form-label">体重 (kg) *</label>
              <input type="number" class="form-input" id="weight" placeholder="例如：65" min="20" max="300" step="0.1">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">糖尿病家族史 *</label>
            <select class="form-select" id="familyHistory">
              <option value="no">无（直系亲属均无糖尿病）</option>
              <option value="yes">有（父母、兄弟姐妹等直系亲属患有糖尿病）</option>
            </select>
          </div>
          <div style="text-align:right;margin-top:20px">
            <button class="btn btn-primary" onclick="nextStep(1)">下一步 →</button>
          </div>
        </div>

        <!-- 第二步：生活方式 -->
        <div id="page2" style="display:none">
          <h3 style="margin-bottom:20px;text-align:center">生活方式与健康状况</h3>
          <div class="form-group">
            <label class="form-label">血压状况</label>
            <select class="form-select" id="bloodPressure">
              <option value="normal">正常（收缩压<120且舒张压<80）</option>
              <option value="borderline">临界高血压（120-139/80-89）</option>
              <option value="high">高血压（≥140/90）</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">运动频率</label>
            <select class="form-select" id="exercise">
              <option value="regular">经常运动（每周中等强度运动≥150分钟）</option>
              <option value="sometimes">偶尔运动（每周运动1-2次）</option>
              <option value="rare">很少或几乎不运动</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">饮食习惯</label>
            <select class="form-select" id="diet">
              <option value="healthy">健康均衡（蔬菜水果多，少糖少油）</option>
              <option value="normal">一般（偶尔高糖高脂饮食）</option>
              <option value="unhealthy">高糖高脂（经常吃甜食、油炸食品）</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">吸烟情况</label>
            <select class="form-select" id="smoking">
              <option value="no">不吸烟</option>
              <option value="yes">目前吸烟</option>
              <option value="quit">已戒烟</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">饮酒情况</label>
            <select class="form-select" id="drinking">
              <option value="no">不饮酒</option>
              <option value="moderate">适量饮酒（每周1-3次）</option>
              <option value="heavy">经常饮酒（每周4次以上）</option>
            </select>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:20px">
            <button class="btn btn-outline" onclick="prevStep(2)">← 上一步</button>
            <button class="btn btn-primary" onclick="nextStep(2)">下一步 →</button>
          </div>
        </div>

        <!-- 第三步：确认提交 -->
        <div id="page3" style="display:none">
          <h3 style="margin-bottom:20px;text-align:center">确认信息并提交</h3>
          <div id="confirmInfo" style="background:#f8fafc;padding:20px;border-radius:10px;margin-bottom:20px"></div>
          <div class="alert alert-info">
            <strong>温馨提示：</strong>本评估基于AI模型分析，结果仅供参考，不能替代专业医疗诊断。如有不适请及时就医。
          </div>
          <div style="display:flex;justify-content:space-between">
            <button class="btn btn-outline" onclick="prevStep(3)">← 上一步</button>
            <button class="btn btn-primary btn-lg" onclick="submitAssessment()" id="submitBtn">
              <span id="submitText">开始AI评估</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 结果区域 -->
      <div id="resultArea" class="risk-result">
        <div style="text-align:center;margin-bottom:30px">
          <div class="gauge-container">
            <div class="gauge-bg" id="gaugeBg"></div>
            <div class="gauge-inner">
              <div style="font-size:42px;font-weight:700" id="resultScore">0</div>
              <div style="font-size:13px;color:var(--text-light)">风险分值</div>
            </div>
          </div>
          <div style="margin-top:16px">
            <span class="tag" id="resultLevel" style="font-size:18px;padding:8px 20px">--</span>
          </div>
        </div>

        <div class="card" style="background:#f8fafc;margin-bottom:20px">
          <h4 style="margin-bottom:12px">📋 AI评估报告</h4>
          <div id="resultAdvice" style="line-height:1.8;font-size:14px"></div>
        </div>

        <div class="grid grid-3" style="margin-bottom:20px">
          <div style="text-align:center;padding:16px;background:#f0f9ff;border-radius:10px">
            <div style="font-size:24px;margin-bottom:6px">🥗</div>
            <h4 style="font-size:14px;margin-bottom:4px">饮食建议</h4>
            <p style="font-size:12px;color:var(--text-light)" id="dietAdvice">--</p>
          </div>
          <div style="text-align:center;padding:16px;background:#f0fdf4;border-radius:10px">
            <div style="font-size:24px;margin-bottom:6px">🏃</div>
            <h4 style="font-size:14px;margin-bottom:4px">运动建议</h4>
            <p style="font-size:12px;color:var(--text-light)" id="exerciseAdvice">--</p>
          </div>
          <div style="text-align:center;padding:16px;background:#fffbeb;border-radius:10px">
            <div style="font-size:24px;margin-bottom:6px">🩺</div>
            <h4 style="font-size:14px;margin-bottom:4px">就医建议</h4>
            <p style="font-size:12px;color:var(--text-light)" id="medicalAdvice">--</p>
          </div>
        </div>

        <div style="text-align:center;display:flex;gap:12px;justify-content:center">
          <button class="btn btn-primary" onclick="window.location.href='plan.html'">获取个性化方案</button>
          <button class="btn btn-secondary" onclick="window.location.href='doctor.html'">在线咨询医师</button>
          <button class="btn btn-outline" onclick="resetForm()">重新评估</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer"></footer>

  <script src="js/common.js"></script>
  <script>
    Utils.initPage('');
    
    let currentStep = 1;
    let formData = {};

    function nextStep(step) {
      // 验证当前步骤
      if (step === 1) {
        const age = document.getElementById('age').value;
        const gender = document.getElementById('gender').value;
        const height = document.getElementById('height').value;
        const weight = document.getElementById('weight').value;
        if (!age || !gender || !height || !weight) {
          Utils.toast('请填写所有必填项', 'warning');
          return;
        }
      }
      
      document.getElementById('page' + step).style.display = 'none';
      document.getElementById('page' + (step + 1)).style.display = 'block';
      
      document.getElementById('step' + step).classList.remove('active');
      document.getElementById('step' + step).classList.add('done');
      document.getElementById('step' + (step + 1)).classList.add('active');
      document.getElementById('line' + step).classList.add('done');
      
      currentStep = step + 1;
      
      if (step === 2) {
        showConfirm();
      }
    }

    function prevStep(step) {
      document.getElementById('page' + step).style.display = 'none';
      document.getElementById('page' + (step - 1)).style.display = 'block';
      
      document.getElementById('step' + step).classList.remove('active');
      document.getElementById('step' + (step - 1)).classList.remove('done');
      document.getElementById('step' + (step - 1)).classList.add('active');
      document.getElementById('line' + (step - 1)).classList.remove('done');
      
      currentStep = step - 1;
    }

    function showConfirm() {
      formData = {
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value === 'male' ? '男' : '女',
        height: document.getElementById('height').value,
        weight: document.getElementById('weight').value,
        familyHistory: document.getElementById('familyHistory').value === 'yes' ? '有' : '无',
        bloodPressure: document.getElementById('bloodPressure').options[document.getElementById('bloodPressure').selectedIndex].text,
        exercise: document.getElementById('exercise').options[document.getElementById('exercise').selectedIndex].text,
        diet: document.getElementById('diet').options[document.getElementById('diet').selectedIndex].text,
        smoking: document.getElementById('smoking').options[document.getElementById('smoking').selectedIndex].text,
        drinking: document.getElementById('drinking').options[document.getElementById('drinking').selectedIndex].text
      };
      
      const bmi = Utils.calcBMI(formData.height, formData.weight);
      const bmiCat = Utils.bmiCategory(bmi);
      
      document.getElementById('confirmInfo').innerHTML = `
        <div class="grid grid-2" style="gap:12px;font-size:14px">
          <div><strong>年龄：</strong>${formData.age} 岁</div>
          <div><strong>性别：</strong>${formData.gender}</div>
          <div><strong>身高：</strong>${formData.height} cm</div>
          <div><strong>体重：</strong>${formData.weight} kg</div>
          <div><strong>BMI：</strong>${bmi} (${bmiCat.label})</div>
          <div><strong>家族史：</strong>${formData.familyHistory}</div>
          <div><strong>血压：</strong>${formData.bloodPressure}</div>
          <div><strong>运动：</strong>${formData.exercise}</div>
          <div><strong>饮食：</strong>${formData.diet}</div>
          <div><strong>吸烟：</strong>${formData.smoking}</div>
          <div style="grid-column:span 2"><strong>饮酒：</strong>${formData.drinking}</div>
        </div>
      `;
    }

    async function submitAssessment() {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitText');
      btn.disabled = true;
      text.innerHTML = '<span class="loading"></span> AI分析中...';
      
      // 构建评估数据
      const profile = {
        age: parseInt(formData.age),
        gender: formData.gender,
        height: formData.height,
        weight: formData.weight,
        bmi: parseFloat(Utils.calcBMI(formData.height, formData.weight)),
        familyHistory: document.getElementById('familyHistory').value,
        bloodPressure: document.getElementById('bloodPressure').value,
        exercise: document.getElementById('exercise').value,
        diet: document.getElementById('diet').value,
        smoking: document.getElementById('smoking')?.value || '不吸烟',
        drinking: document.getElementById('drinking')?.value || '不饮酒'
      };
      
      // 基础评分（用于仪表盘展示）
      const result = MockData.predictRisk(profile);
      
      // 调用AI生成详细评估报告
      try {
        const aiResult = await DifyAPI.runWorkflow({
          type: 'risk_prediction',
          ...profile
        });
        if (aiResult && aiResult.result) {
          result.aiReport = aiResult.result;
        }
      } catch (e) {
        console.error('AI report generation failed:', e);
      }
      
      // 保存记录
      const records = Storage.get('riskRecords') || [];
      records.unshift({ ...result, profile, formData, date: new Date().toISOString() });
      Storage.set('riskRecords', records);
      
      // 显示结果
      showResult(result);
      
      btn.disabled = false;
      text.textContent = '开始AI评估';
    }

    function showResult(result) {
      document.getElementById('formArea').style.display = 'none';
      document.querySelector('.step-indicator').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
      
      // 动画显示分数
      let score = 0;
      const target = result.score;
      const timer = setInterval(() => {
        score += 2;
        if (score >= target) { score = target; clearInterval(timer); }
        document.getElementById('resultScore').textContent = score;
      }, 30);
      
      const levelEl = document.getElementById('resultLevel');
      levelEl.textContent = result.level;
      levelEl.className = 'tag tag-' + result.color;
      
      // 仪表盘颜色
      const gaugeColors = { green: '#10b981', orange: '#f59e0b', red: '#ef4444' };
      document.getElementById('gaugeBg').style.background = `conic-gradient(${gaugeColors[result.color]} 0deg ${result.score * 3.6}deg, #e2e8f0 ${result.score * 3.6}deg 360deg)`;
      
      // 建议内容
      document.getElementById('resultAdvice').innerHTML = `
        <p style="margin-bottom:10px"><strong>评估结论：</strong>${result.advice}</p>
        <p style="margin-bottom:10px"><strong>风险因素分析：</strong></p>
        <ul style="padding-left:20px;margin-bottom:10px">
          ${formData.age >= 45 ? '<li>年龄偏大（' + formData.age + '岁），糖尿病风险随年龄增长而增加</li>' : ''}
          ${parseFloat(Utils.calcBMI(formData.height, formData.weight)) >= 24 ? '<li>BMI偏高（' + Utils.calcBMI(formData.height, formData.weight) + '），超重/肥胖是糖尿病重要危险因素</li>' : ''}
          ${formData.familyHistory === '有' ? '<li>有糖尿病家族史，遗传因素增加患病风险</li>' : ''}
          ${formData.bloodPressure !== '正常（收缩压<120且舒张压<80）' ? '<li>血压异常，高血压与糖尿病常伴随发生</li>' : ''}
          ${formData.exercise.includes('很少') ? '<li>运动不足，缺乏运动降低胰岛素敏感性</li>' : ''}
          ${formData.diet.includes('高糖') ? '<li>高糖高脂饮食，增加胰岛负担</li>' : ''}
        </ul>
        <p><strong>建议：</strong>请结合下方个性化建议进行健康管理，并定期监测血糖。</p>
      `;
      
      // 分项建议
      document.getElementById('dietAdvice').textContent = result.color === 'green' ? '保持均衡饮食，控制总热量' : '严格控制碳水摄入，选择低GI食物，增加膳食纤维';
      document.getElementById('exerciseAdvice').textContent = result.color === 'green' ? '保持规律运动习惯' : '每周至少150分钟中等强度有氧运动，配合力量训练';
      document.getElementById('medicalAdvice').textContent = result.color === 'red' ? '建议尽快就医，进行OGTT等专业检查' : '每年体检时检测空腹血糖和糖化血红蛋白';
    }

    function resetForm() {
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('formArea').style.display = 'block';
      document.querySelector('.step-indicator').style.display = 'flex';
      document.getElementById('page1').style.display = 'block';
      document.getElementById('page2').style.display = 'none';
      document.getElementById('page3').style.display = 'none';
      document.querySelectorAll('.step-dot').forEach((d, i) => {
        d.className = 'step-dot' + (i === 0 ? ' active' : '');
      });
      document.querySelectorAll('.step-line').forEach(l => l.classList.remove('done'));
      currentStep = 1;
    }
  </script>
</body>
</html>
