<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>医师咨询 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .doctor-card { padding: 16px; border-radius: 10px; cursor: pointer; transition: all 0.3s; margin-bottom: 12px; border: 2px solid transparent; }
    .doctor-card:hover { background: #f0f9ff; }
    .doctor-card.active { border-color: var(--primary); background: #f0f9ff; }
    .doctor-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
    .chat-container { display: flex; flex-direction: column; height: 600px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; border-radius: 10px; margin-bottom: 16px; }
    .chat-message { margin-bottom: 16px; display: flex; gap: 10px; }
    .chat-message.user { flex-direction: row-reverse; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .chat-bubble { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
    .chat-message.ai .chat-bubble { background: white; border-top-left-radius: 4px; }
    .chat-message.user .chat-bubble { background: var(--primary); color: white; border-top-right-radius: 4px; }
    .chat-input-area { display: flex; gap: 10px; }
    .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="navbar"></nav>

  <div class="container">
    <div class="grid" style="grid-template-columns: 320px 1fr; gap:24px">
      <!-- 医师列表 -->
      <div>
        <div class="card">
          <div class="card-title"><span class="icon">👨‍⚕️</span>推荐医师</div>
          <div id="doctorList"></div>
        </div>
        
        <div class="card">
          <div class="card-title"><span class="icon">💡</span>咨询提示</div>
          <div style="font-size:13px;color:var(--text-light);line-height:1.8">
            <p style="margin-bottom:8px">• 请详细描述您的症状和健康状况</p>
            <p style="margin-bottom:8px">• 提供近期的血糖监测数据</p>
            <p style="margin-bottom:8px">• 告知正在使用的药物</p>
            <p style="margin-bottom:8px">• 医师建议仅供参考，不能替代面诊</p>
            <p>• 紧急情况请立即拨打120</p>
          </div>
        </div>
      </div>

      <!-- 聊天区域 -->
      <div class="card">
        <div class="chat-container">
          <div style="display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid #e2e8f0;margin-bottom:16px">
            <div class="chat-avatar" id="chatAvatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">👨‍⚕️</div>
            <div>
              <h3 style="margin-bottom:4px" id="chatDoctorName">请选择医师</h3>
              <p style="font-size:13px;color:var(--text-light)" id="chatDoctorInfo">从左侧选择一位医师开始咨询</p>
            </div>
          </div>

          <div class="chat-messages" id="chatMessages">
            <div style="text-align:center;color:var(--text-light);padding:40px 0">
              <div style="font-size:48px;margin-bottom:16px">💬</div>
              <h3 style="margin-bottom:8px">开始您的健康咨询</h3>
              <p>请从左侧选择一位医师，开始在线咨询</p>
            </div>
          </div>

          <div class="quick-tags" id="quickTags" style="display:none">
            <span class="tag tag-blue" style="cursor:pointer;padding:6px 12px" onclick="quickAsk('血糖多少算正常？')">血糖多少算正常？</span>
            <span class="tag tag-green" style="cursor:pointer;padding:6px 12px" onclick="quickAsk('糖尿病患者能吃水果吗？')">能吃水果吗？</span>
            <span class="tag tag-orange" style="cursor:pointer;padding:6px 12px" onclick="quickAsk('如何预防糖尿病并发症？')">如何预防并发症？</span>
          </div>

          <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="请输入您的问题..." onkeypress="if(event.key==='Enter')sendMessage()" style="flex:1">
            <button class="btn btn-primary" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer"></footer>

  <script src="js/common.js"></script>
  <script>
    Utils.initPage('doctor.html');

    // 医师数据
    const doctors = [
      { id: 1, name: '张建国', title: '主任医师', department: '内分泌科', experience: 25, avatar: '👨‍⚕️', specialty: '糖尿病及并发症诊治' },
      { id: 2, name: '李美华', title: '副主任医师', department: '内分泌科', experience: 18, avatar: '👩‍⚕️', specialty: '妊娠糖尿病、青少年糖尿病' },
      { id: 3, name: '王志强', title: '主治医师', department: '营养科', experience: 12, avatar: '👨‍⚕️', specialty: '糖尿病饮食管理' },
      { id: 4, name: '陈晓燕', title: '主任医师', department: '心血管内科', experience: 22, avatar: '👩‍⚕️', specialty: '糖尿病心血管并发症' }
    ];

    let selectedDoctor = null;
    let messages = [];

    // 渲染医师列表
    function renderDoctors() {
      const list = document.getElementById('doctorList');
      list.innerHTML = doctors.map(d => `
        <div class="doctor-card" onclick="selectDoctor(${d.id})" id="doctor-${d.id}">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="doctor-avatar">${d.avatar}</div>
            <div style="flex:1">
              <div style="font-weight:600;margin-bottom:2px">${d.name} ${d.title}</div>
              <div style="font-size:12px;color:var(--text-light)">${d.department}</div>
              <div style="font-size:11px;color:var(--text-light);margin-top:2px">从业${d.experience}年 · ${d.specialty}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 选择医师
    function selectDoctor(id) {
      selectedDoctor = doctors.find(d => d.id === id);
      
      // 更新选中状态
      document.querySelectorAll('.doctor-card').forEach(c => c.classList.remove('active'));
      document.getElementById('doctor-' + id).classList.add('active');
      
      // 更新聊天头部
      document.getElementById('chatAvatar').textContent = selectedDoctor.avatar;
      document.getElementById('chatDoctorName').textContent = `${selectedDoctor.name} ${selectedDoctor.title}`;
      document.getElementById('chatDoctorInfo').textContent = `${selectedDoctor.department} · 从业${selectedDoctor.experience}年`;
      
      // 显示快捷标签
      document.getElementById('quickTags').style.display = 'flex';
      
      // 初始化聊天
      messages = [];
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      addMessage('ai', `您好，我是${selectedDoctor.name}${selectedDoctor.title}，从事${selectedDoctor.department}临床工作${selectedDoctor.experience}年。请问有什么可以帮助您的？`);
    }

    // 添加消息
    function addMessage(type, text) {
      messages.push({ type, text });
      const chatMessages = document.getElementById('chatMessages');
      const avatar = type === 'ai' ? (selectedDoctor?.avatar || '👨‍⚕️') : '🧑';
      const div = document.createElement('div');
      div.className = `chat-message ${type}`;
      div.innerHTML = `
        <div class="chat-avatar" style="background:${type === 'ai' ? 'linear-gradient(135deg,#667eea,#764ba2)' : '#e2e8f0'}">${avatar}</div>
        <div class="chat-bubble">${type === 'ai' ? Utils.renderMarkdown(text) : text}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 快捷提问
    function quickAsk(question) {
      document.getElementById('chatInput').value = question;
      sendMessage();
    }

    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      
      if (!text) {
        Utils.toast('请输入问题', 'warning');
        return;
      }
      
      if (!selectedDoctor) {
        Utils.toast('请先选择一位医师', 'warning');
        return;
      }
      
      addMessage('user', text);
      input.value = '';
      
      // 显示加载动画
      const chatMessages = document.getElementById('chatMessages');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'chat-message ai';
      loadingDiv.id = 'loadingMsg';
      loadingDiv.innerHTML = `
        <div class="chat-avatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">${selectedDoctor.avatar}</div>
        <div class="chat-bubble">
          <span style="display:inline-block;animation:bounce 1.4s infinite">●</span>
          <span style="display:inline-block;animation:bounce 1.4s infinite 0.2s">●</span>
          <span style="display:inline-block;animation:bounce 1.4s infinite 0.4s">●</span>
        </div>
      `;
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      try {
        // 构建医师角色提示
        const doctorPrompt = `你是一位${selectedDoctor.department}的${selectedDoctor.title}，名叫${selectedDoctor.name}，有${selectedDoctor.experience}年临床经验，擅长${selectedDoctor.specialty}。请以专业医师的身份回答患者的问题，语气亲切专业，给出实用的建议。记住：你是医师，不是AI助手。问题：${text}`;
        
        // 调用本地Ollama模型
        const response = await fetch(`${CONFIG.OLLAMA_API_BASE}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: CONFIG.OLLAMA_MODEL,
            prompt: doctorPrompt,
            stream: false
          })
        });
        
        const result = await response.json();
        let reply = result.response || '抱歉，我暂时无法回答这个问题。';
        
        // 移除加载动画
        document.getElementById('loadingMsg')?.remove();
        
        // 添加AI回复
        addMessage('ai', reply);
        
      } catch (error) {
        document.getElementById('loadingMsg')?.remove();
        // 使用预设回答作为备用
        const fallbackReply = getFallbackReply(text);
        addMessage('ai', fallbackReply);
      }
    }

    // 预设回答（备用）
    function getFallbackReply(question) {
      const q = question.toLowerCase();
      if (q.includes('血糖') || q.includes('正常')) {
        return `根据《中国2型糖尿病防治指南》，血糖正常范围如下：

- 空腹血糖：3.9-6.1 mmol/L
- 餐后2小时血糖：<7.8 mmol/L
- 糖化血红蛋白（HbA1c）：<6.5%

如果您的血糖超出这个范围，建议及时就医进行进一步检查。`;
      }
      if (q.includes('水果') || q.includes('吃')) {
        return `糖尿病患者是可以吃水果的，但需要注意以下几点：

1. **选择低GI水果**：如苹果、梨、柚子、草莓、蓝莓等，避免荔枝、龙眼、榴莲等高糖水果
2. **控制摄入量**：每次约100-200克，相当于一个中等大小的苹果
3. **选择合适时间**：两餐之间食用，避免餐后立即吃水果
4. **监测血糖**：吃水果后注意监测血糖变化`;
      }
      if (q.includes('并发症') || q.includes('预防')) {
        return `预防糖尿病并发症需要综合管理：

**1. 血糖控制**
- 定期监测空腹和餐后血糖
- 每3个月检查糖化血红蛋白，目标<7%

**2. 血压管理**
- 目标血压<130/80 mmHg
- 低盐饮食，适量运动

**3. 血脂管理**
- 定期检查血脂
- 低密度脂蛋白胆固醇<2.6 mmol/L

**4. 定期筛查**
- 每年检查眼底、肾功能、足部
- 如有不适及时就医`;
      }
      return `感谢您的咨询。关于"${question}"这个问题，建议您：

1. 提供更详细的信息，例如您的年龄、糖尿病类型、病程、目前用药情况等
2. 如果有近期的血糖监测数据或检查报告，可以一并提供
3. 必要时请前往医院进行专业检查和诊断

您还有其他问题吗？`;
    }

    // 初始化
    renderDoctors();
  </script>
</body>
</html>
