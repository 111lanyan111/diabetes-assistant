<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康打卡 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkin-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .checkin-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; border: 2px solid transparent;
    }
    .checkin-day.checked { background: var(--secondary); color: white; }
    .checkin-day.today { border-color: var(--primary); }
    .checkin-day.empty { background: #f1f5f9; color: #cbd5e1; }
    .stat-ring {
      width: 120px; height: 120px; border-radius: 50%;
      background: conic-gradient(var(--secondary) 0deg 252deg, #e2e8f0 252deg 360deg);
      display: flex; align-items: center; justify-content: center; margin: 0 auto;
    }
    .stat-ring-inner {
      width: 90px; height: 90px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
  </style>
</head>
<body>
  <nav class="navbar"></nav>

  <div class="container">
    <div class="grid grid-3" style="margin-bottom:24px">
      <!-- 打卡统计 -->
      <div class="card" style="text-align:center">
        <h3 style="margin-bottom:16px">本月打卡</h3>
        <div class="stat-ring" id="statRing">
          <div class="stat-ring-inner">
            <div style="font-size:28px;font-weight:700" id="monthCount">0</div>
            <div style="font-size:12px;color:var(--text-light)">天</div>
          </div>
        </div>
        <p style="margin-top:12px;font-size:13px;color:var(--text-light)">连续打卡 <strong id="streakDays" style="color:var(--secondary)">0</strong> 天</p>
      </div>

      <!-- 今日打卡 -->
      <div class="card" style="grid-column: span 2">
        <div class="card-title"><span class="icon">✅</span>今日健康打卡</div>
        <form onsubmit="return submitCheckin(event)">
          <div class="grid grid-2" style="gap:16px">
            <div class="form-group">
              <label class="form-label">空腹血糖 (mmol/L)</label>
              <input type="number" class="form-input" id="bloodSugar" placeholder="例如：5.6" step="0.1" min="2" max="30">
            </div>
            <div class="form-group">
              <label class="form-label">餐后2小时血糖 (mmol/L)</label>
              <input type="number" class="form-input" id="bloodSugar2h" placeholder="例如：7.8" step="0.1" min="2" max="30">
            </div>
            <div class="form-group">
              <label class="form-label">今日饮食</label>
              <select class="form-select" id="dietToday">
                <option value="good">健康均衡</option>
                <option value="normal">一般</option>
                <option value="bad">不够健康</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">运动情况</label>
              <select class="form-select" id="exerciseToday">
                <option value="30">30分钟以上</option>
                <option value="15">15-30分钟</option>
                <option value="0">未运动</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">体重 (kg)</label>
              <input type="number" class="form-input" id="weightToday" placeholder="例如：65.5" step="0.1">
            </div>
            <div class="form-group">
              <label class="form-label">睡眠时长 (小时)</label>
              <input type="number" class="form-input" id="sleepToday" placeholder="例如：7.5" step="0.5" min="0" max="24">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">今日备注</label>
            <textarea class="form-textarea" id="noteToday" placeholder="记录今天的身体感受、用药情况等..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">完成今日打卡</button>
        </form>
      </div>
    </div>

    <div class="grid grid-2" style="gap:24px">
      <!-- 打卡日历 -->
      <div class="card">
        <div class="card-title" style="justify-content:space-between">
          <span><span class="icon">📅</span>打卡日历</span>
          <span id="calendarMonth" style="font-size:14px;font-weight:normal"></span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;text-align:center;font-size:12px;color:var(--text-light)">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="checkin-grid" id="checkinCalendar"></div>
        <div style="margin-top:16px;display:flex;gap:16px;font-size:12px;color:var(--text-light);justify-content:center">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:14px;background:var(--secondary);border-radius:3px;display:inline-block"></span> 已打卡</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:14px;height:14px;background:#f1f5f9;border-radius:3px;display:inline-block"></span> 未打卡</span>
        </div>
      </div>

      <!-- AI打卡分析 -->
      <div class="card">
        <div class="card-title" style="justify-content:space-between">
          <span><span class="icon">🤖</span>AI智能分析</span>
          <button class="btn btn-primary btn-sm" onclick="analyzeCheckin()" id="analyzeBtn">
            <span id="analyzeText">开始分析</span>
          </button>
        </div>
        <div id="analysisResult">
          <div style="text-align:center;padding:30px 0;color:var(--text-light)">
            <div style="font-size:48px;margin-bottom:12px">📊</div>
            <p>点击上方按钮，AI将分析您的打卡数据</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 打卡记录 -->
    <div class="card" style="margin-top:24px">
      <div class="card-title"><span class="icon">📋</span>打卡记录</div>
      <div id="checkinRecords">
        <div style="text-align:center;padding:30px 0;color:var(--text-light)">
          <div style="font-size:48px;margin-bottom:12px">📝</div>
          暂无打卡记录，开始您的第一次打卡吧！
        </div>
      </div>
    </div>
  </div>

  <footer class="footer"></footer>

  <script src="js/common.js"></script>
  <script>
    Utils.initPage('checkin.html');
    
    if (!Storage.getCurrentUser()) {
      Utils.toast('请先登录', 'warning');
      setTimeout(() => window.location.href = 'login.html', 1000);
    }

    // 提交打卡
    function submitCheckin(e) {
      e.preventDefault();
      const today = new Date().toISOString().split('T')[0];
      const existing = Storage.getCheckins().find(c => c.date === today);
      
      if (existing) {
        Utils.toast('今天已经打卡过了', 'warning');
        return false;
      }
      
      const record = {
        bloodSugar: parseFloat(document.getElementById('bloodSugar').value) || null,
        bloodSugar2h: parseFloat(document.getElementById('bloodSugar2h').value) || null,
        diet: document.getElementById('dietToday').value,
        exercise: parseInt(document.getElementById('exerciseToday').value),
        weight: parseFloat(document.getElementById('weightToday').value) || null,
        sleep: parseFloat(document.getElementById('sleepToday').value) || null,
        note: document.getElementById('noteToday').value
      };
      
      Storage.addCheckin(record);
      Utils.toast('打卡成功！', 'success');
      
      // 重置表单
      e.target.reset();
      
      // 刷新显示
      renderCalendar();
      renderRecords();
      updateStats();
      
      return false;
    }

    // 渲染日历
    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      
      document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const checkins = Storage.getCheckins();
      const checkedDates = new Set(checkins.map(c => c.date));
      
      const calendar = document.getElementById('checkinCalendar');
      calendar.innerHTML = '';
      
      for (let i = 0; i < firstDay; i++) {
        calendar.innerHTML += '<div class="checkin-day empty"></div>';
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isChecked = checkedDates.has(dateStr);
        const isToday = day === today;
        calendar.innerHTML += `<div class="checkin-day ${isChecked ? 'checked' : ''} ${isToday ? 'today' : ''}">${day}</div>`;
      }
    }

    // 渲染记录
    function renderRecords() {
      const records = Storage.getCheckins();
      const container = document.getElementById('checkinRecords');
      
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--text-light)"><div style="font-size:48px;margin-bottom:12px">📝</div>暂无打卡记录</div>';
        return;
      }
      
      container.innerHTML = '<table class="data-table"><thead><tr><th>日期</th><th>空腹血糖</th><th>餐后血糖</th><th>饮食</th><th>运动</th><th>体重</th><th>睡眠</th><th>备注</th></tr></thead><tbody>' +
        records.map(r => `
          <tr>
            <td>${r.date}</td>
            <td>${r.bloodSugar ? r.bloodSugar + ' mmol/L' : '-'}</td>
            <td>${r.bloodSugar2h ? r.bloodSugar2h + ' mmol/L' : '-'}</td>
            <td><span class="tag tag-${r.diet === 'good' ? 'green' : r.diet === 'normal' ? 'blue' : 'orange'}">${r.diet === 'good' ? '健康' : r.diet === 'normal' ? '一般' : '欠佳'}</span></td>
            <td>${r.exercise > 0 ? r.exercise + '分钟' : '未运动'}</td>
            <td>${r.weight ? r.weight + ' kg' : '-'}</td>
            <td>${r.sleep ? r.sleep + '小时' : '-'}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.note || '-'}</td>
          </tr>
        `).join('') + '</tbody></table>';
    }

    // 更新统计
    function updateStats() {
      const records = Storage.getCheckins();
      const now = new Date();
      const monthPrefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const monthRecords = records.filter(r => r.date.startsWith(monthPrefix));
      
      document.getElementById('monthCount').textContent = monthRecords.length;
      
      // 计算连续打卡
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        if (records.some(r => r.date === dateStr)) {
          streak++;
        } else if (i > 0) {
          break;
        }
      }
      document.getElementById('streakDays').textContent = streak;
      
      // 更新环形进度
      const percent = Math.min(monthRecords.length / 30, 1);
      const degrees = percent * 360;
      document.getElementById('statRing').style.background = `conic-gradient(var(--secondary) 0deg ${degrees}deg, #e2e8f0 ${degrees}deg 360deg)`;
    }

    // AI分析
    async function analyzeCheckin() {
      const records = Storage.getCheckins();
      if (records.length === 0) {
        Utils.toast('暂无打卡数据可供分析', 'warning');
        return;
      }
      
      const btn = document.getElementById('analyzeText');
      btn.innerHTML = '<span class="loading"></span> 分析中...';
      document.getElementById('analyzeBtn').disabled = true;
      
      // 计算统计
      const bsValues = records.filter(r => r.bloodSugar).map(r => r.bloodSugar);
      const avgBS = bsValues.length > 0 ? (bsValues.reduce((a, b) => a + b, 0) / bsValues.length).toFixed(1) : '--';
      const exerciseDays = records.filter(r => r.exercise > 0).length;
      const goodDietDays = records.filter(r => r.diet === 'good').length;
      const avgWeight = records.filter(r => r.weight).map(r => r.weight);
      const avgW = avgWeight.length > 0 ? (avgWeight.reduce((a, b) => a + b, 0) / avgWeight.length).toFixed(1) : '--';
      
      let score = 60;
      if (avgBS !== '--' && avgBS < 7) score += 15;
      if (exerciseDays >= records.length * 0.7) score += 10;
      if (goodDietDays >= records.length * 0.7) score += 10;
      if (records.length >= 7) score += 5;
      score = Math.min(score, 100);
      
      let level, color, advice;
      if (score >= 85) { level = '优秀'; color = 'green'; advice = '您的健康管理非常出色！请继续保持良好的生活习惯。'; }
      else if (score >= 70) { level = '良好'; color = 'blue'; advice = '整体健康状况良好，建议在运动和饮食方面进一步优化。'; }
      else if (score >= 60) { level = '一般'; color = 'orange'; advice = '健康管理有待加强，建议增加运动频率，注意饮食控制。'; }
      else { level = '需改善'; color = 'red'; advice = '健康管理需要重视，建议制定详细计划并严格执行，必要时咨询医师。'; }
      
      // 调用AI生成详细分析
      let aiAdvice = advice;
      try {
        const aiResult = await DifyAPI.runWorkflow({
          type: 'checkin_analysis',
          days: records.length,
          avgFasting: avgBS,
          avgPostprandial: '--',
          avgWeight: avgW,
          checkinDays: records.length
        });
        if (aiResult && aiResult.result) {
          aiAdvice = aiResult.result;
        }
      } catch (e) {
        console.error('AI analysis failed:', e);
      }
      
      document.getElementById('analysisResult').innerHTML = `
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:48px;font-weight:700;color:var(--${color})">${score}</div>
          <span class="tag tag-${color}" style="font-size:14px;padding:4px 12px">${level}</span>
        </div>
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>平均空腹血糖</span><span style="font-weight:600">${avgBS} mmol/L</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>运动达标率</span><span style="font-weight:600">${records.length > 0 ? Math.round(exerciseDays / records.length * 100) : 0}%</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>健康饮食天数</span><span style="font-weight:600">${goodDietDays}天</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span>累计打卡</span><span style="font-weight:600">${records.length}天</span>
          </div>
        </div>
        <div class="alert alert-${color === 'red' ? 'error' : color === 'orange' ? 'warning' : color === 'green' ? 'success' : 'info'}">
          <strong>AI分析报告：</strong><div style="white-space:pre-wrap;margin-top:8px;line-height:1.8">${aiAdvice}</div>
        </div>
        <div style="margin-top:16px">
          <h4 style="font-size:14px;margin-bottom:8px">📌 改进建议</h4>
          <ul style="font-size:13px;line-height:1.8;padding-left:20px;color:var(--text-light)">
            <li>坚持每日打卡，建立健康管理习惯</li>
            <li>保持规律运动，每周至少150分钟</li>
            <li>注意饮食均衡，控制碳水摄入</li>
            <li>定期监测血糖，关注变化趋势</li>
          </ul>
        </div>
      `;
      
      btn.textContent = '重新分析';
      document.getElementById('analyzeBtn').disabled = false;
    }

    // 初始化
    renderCalendar();
    renderRecords();
    updateStats();
  </script>
</body>
</html>
