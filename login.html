<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册 - 糖尿病预治智能助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 32px;
      text-align: center;
    }
    .auth-header .logo { font-size: 48px; margin-bottom: 10px; }
    .auth-header h1 { font-size: 22px; margin-bottom: 6px; }
    .auth-header p { font-size: 13px; opacity: 0.9; }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      color: var(--text-light);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .auth-body { padding: 28px 32px 32px; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      opacity: 0.8;
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 返回首页</a>
  
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">🩺</div>
      <h1>糖尿病预治智能助手</h1>
      <p>AI驱动的健康管理平台</p>
    </div>
    
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">登录</div>
      <div class="auth-tab" data-tab="register">注册</div>
    </div>
    
    <div class="auth-body">
      <!-- 登录表单 -->
      <form class="auth-form active" id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label">手机号 / 用户名</label>
          <input type="text" class="form-input" id="loginUsername" placeholder="请输入手机号或用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="rememberMe"> 记住我
          </label>
          <a href="#" style="color:var(--primary)">忘记密码？</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>
        <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)">
          还没有账号？<a href="#" onclick="switchTab('register')" style="color:var(--primary)">立即注册</a>
        </p>
      </form>
      
      <!-- 注册表单 -->
      <form class="auth-form" id="registerForm" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="regUsername" placeholder="请输入用户名" required minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号" required pattern="1[3-9]\d{9}">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" class="form-input" id="regConfirmPassword" placeholder="请再次输入密码" required>
        </div>
        <div style="margin-bottom:20px">
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer">
            <input type="checkbox" id="agreeTerms" required style="margin-top:3px">
            <span>我已阅读并同意<a href="#" style="color:var(--primary)">《用户协议》</a>和<a href="#" style="color:var(--primary)">《隐私政策》</a></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">注 册</button>
        <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)">
          已有账号？<a href="#" onclick="switchTab('login')" style="color:var(--primary)">立即登录</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 切换登录/注册
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    // 登录处理（调用后端API）
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const response = await fetch('http://4342b9a6.r9.cpolar.top/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        
        if (result.code === 0 && result.data) {
          Storage.setCurrentUser(result.data);
          Utils.toast('登录成功！欢迎 ' + (result.data.real_name || result.data.username), 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          Utils.toast(result.message || '用户名或密码错误', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        Utils.toast('登录失败，请确保后端服务已启动（http://4342b9a6.r9.cpolar.top）', 'error');
      }
      return false;
    }

    // 注册处理（调用后端API）
    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      
      if (password !== confirmPassword) {
        Utils.toast('两次输入的密码不一致', 'error');
        return false;
      }
      
      try {
        const response = await fetch('http://4342b9a6.r9.cpolar.top/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, phone, role: 'user', status: 'active' })
        });
        const result = await response.json();
        
        if (result.code === 0) {
          Utils.toast('注册成功！请登录', 'success');
          setTimeout(() => { switchTab('login'); }, 1000);
        } else {
          Utils.toast(result.message || '注册失败', 'error');
        }
      } catch (error) {
        console.error('Register error:', error);
        Utils.toast('注册失败，请确保后端服务已启动', 'error');
      }
      return false;
    }
  </script>
</body>
</html>
